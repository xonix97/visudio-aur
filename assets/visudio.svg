<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="60%" stop-color="#090b10"/>
      <stop offset="100%" stop-color="#030407"/>
    </radialGradient>

    <!-- Perimeter Ambient Glow -->
    <linearGradient id="glowTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a86ff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#8338ec" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#ff006e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fb5607" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="glowBottom" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fb5607" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#ffbe0b" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#00f5d4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3a86ff" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Waveform Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="35%" stop-color="#3a86ff"/>
      <stop offset="70%" stop-color="#ff006e"/>
      <stop offset="100%" stop-color="#ffbe0b"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="32" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="perimeterBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#222838" stroke-width="4"/>

  <!-- Screen Perimeter Liquid Glow Halo (Behind Screen Edge) -->
  <rect x="56" y="56" width="400" height="400" rx="80" fill="none" stroke="url(#glowTop)" stroke-width="28" opacity="0.45" filter="url(#perimeterBlur)"/>
  
  <!-- Screen Rim -->
  <rect x="68" y="68" width="376" height="376" rx="68" fill="#0b0d13" stroke="#1d2230" stroke-width="3"/>

  <!-- High-Intensity Perimeter Glow Border -->
  <rect x="74" y="74" width="364" height="364" rx="62" fill="none" stroke="url(#glowTop)" stroke-width="8" filter="url(#softGlow)"/>
  <rect x="74" y="74" width="364" height="364" rx="62" fill="none" stroke="url(#glowBottom)" stroke-width="3" opacity="0.9"/>

  <!-- Audio Reactive Visualizer Waveform In Display Center -->
  <g filter="url(#softGlow)">
    <!-- Symmetric Spectrum Bars -->
    <rect x="136" y="238" width="12" height="36" rx="6" fill="#00f5d4" opacity="0.85"/>
    <rect x="160" y="214" width="12" height="84" rx="6" fill="#00e5ff" opacity="0.9"/>
    <rect x="184" y="186" width="12" height="140" rx="6" fill="#3a86ff"/>
    <rect x="208" y="152" width="12" height="208" rx="6" fill="#7209b7"/>
    <rect x="232" y="128" width="12" height="256" rx="6" fill="#b5179e"/>
    <rect x="256" y="112" width="12" height="288" rx="6" fill="#f72585"/>
    <rect x="280" y="136" width="12" height="240" rx="6" fill="#ff006e"/>
    <rect x="304" y="168" width="12" height="176" rx="6" fill="#fb5607"/>
    <rect x="328" y="202" width="12" height="108" rx="6" fill="#ffbe0b"/>
    <rect x="352" y="232" width="12" height="48" rx="6" fill="#00f5d4" opacity="0.85"/>
  </g>

  <!-- Central Dynamic Wave Line -->
  <path d="M 120 256 Q 160 256, 184 210 T 232 170 T 256 256 T 280 342 T 328 302 T 392 256" 
        fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)" opacity="0.95"/>
</svg>
